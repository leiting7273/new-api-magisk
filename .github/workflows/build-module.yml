name: Build KSU/Magisk Module

on:
  schedule:
    - cron: '0 4 * * *'   # 每天 UTC 04:00（北京时间 12:00）自动检查上游新版本
  workflow_dispatch:
    inputs:
      version:
        description: '上游版本号，如 v1.0.0-rc.44（留空=自动取最新）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream version
        id: ver
        run: |
          set -e
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V=$(curl -sfL https://api.github.com/repos/QuantumNous/new-api/releases/latest | jq -r '.tag_name')
          fi
          test -n "$V" && test "$V" != "null"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Skip if this version was already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify arm64 binary
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/QuantumNous/new-api/releases/download/$V"
          curl -fL -o new-api "$BASE/new-api-arm64-$V"
          curl -fL -o checksums-linux.txt "$BASE/checksums-linux.txt"
          EXPECTED=$(awk '/new-api-arm64-/{print $1}' checksums-linux.txt | head -1)
          ACTUAL=$(sha256sum new-api | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL"

      - name: Prepare glibc runtime libs
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          mkdir -p pkg_lib
          if [ -f module/lib/ld-linux-aarch64.so.1 ] && [ -f module/lib/libc.so.6 ]; then
            echo "== Using glibc libs bundled in this repo =="
            cp module/lib/ld-linux-aarch64.so.1 module/lib/libc.so.6 pkg_lib/
          else
            echo "== Fetching glibc libs from Debian (arm64) =="
            sudo apt-get update -qq
            sudo apt-get install -y -qq binutils xz-utils >/dev/null
            OK=0
            for MIRROR in "https://deb.debian.org/debian" "https://mirrors.aliyun.com/debian" "https://mirrors.tuna.tsinghua.edu.cn/debian"; do
              echo "-- trying $MIRROR"
              rm -rf .glibc && mkdir -p .glibc && cd .glibc
              if curl -fsSL -o Packages.gz "$MIRROR/dists/stable/main/binary-arm64/Packages.gz" \
                 && zcat Packages.gz > Packages; then
                FN=$(awk '/^Package: libc6$/{f=1} f&&/^Filename: /{print $2; exit}' Packages)
                if [ -n "$FN" ] && curl -fsSL -o libc6.deb "$MIRROR/$FN" && ar x libc6.deb \
                   && tar -xJf data.tar.xz; then
                  L=$(find . -type f -name 'ld-linux-aarch64.so.1' | head -1)
                  C=$(find . -type f -name 'libc.so.6' | head -1)
                  if [ -n "$L" ] && [ -n "$C" ]; then
                    cp "$L" ../pkg_lib/ld-linux-aarch64.so.1
                    cp "$C" ../pkg_lib/libc.so.6
                    OK=1
                  fi
                fi
              fi
              cd ..
              [ "$OK" = "1" ] && break
            done
            test "$OK" = "1"
          fi
          ls -l pkg_lib

      - name: Assemble module zip
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          VC=$(date -u +%y%m%d%H%M)
          OUT="pkg"
          mkdir -p "$OUT/lib"
          cp module/customize.sh module/service.sh "$OUT/"
          sed -e "s/@VERSION@/$V/" -e "s/@VERSION_CODE@/$VC/" module/module.prop.template > "$OUT/module.prop"
          cp new-api "$OUT/"
          cp pkg_lib/ld-linux-aarch64.so.1 pkg_lib/libc.so.6 "$OUT/lib/"
          chmod 0755 "$OUT/new-api" "$OUT/lib/"* "$OUT/"*.sh
          ( cd "$OUT" && zip -r "../newapi-module-$V.zip" module.prop customize.sh service.sh new-api lib )
          ls -lh "newapi-module-$V.zip"

      - name: Publish to releases
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          gh release create "$V" "newapi-module-$V.zip" \
            --title "newapi-module $V" \
            --notes "自动打包：基于上游 $V 的 aarch64 二进制，内置 glibc 运行库（CI 自动提取），适用于 KernelSU / Magisk（同一 zip 通用）。开机自启，监听 0.0.0.0:3000，数据目录 /data/adb/newapi。"
